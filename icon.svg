<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f6e3ae"/>
      <stop offset=".40" stop-color="#ddb962"/>
      <stop offset="1"   stop-color="#9d7529"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="26%" r="64%">
      <stop offset="0"   stop-color="#d8b45f" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#d8b45f" stop-opacity=".07"/>
      <stop offset="1"   stop-color="#d8b45f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f29"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 光の粒（意図が叶うしるし） -->
  <g fill="#f6e3ae">
    <path d="M256 70 L263.5 104 L297 111.5 L263.5 119 L256 153 L248.5 119 L215 111.5 L248.5 104 Z"/>
    <circle cx="170" cy="146" r="3" opacity=".5"/>
    <circle cx="348" cy="134" r="2.4" opacity=".42"/>
    <circle cx="322" cy="178" r="1.9" opacity=".3"/>
    <circle cx="192" cy="192" r="1.9" opacity=".28"/>
  </g>

  <g fill="url(#gold)">
    <!-- 中央の塔 -->
    <rect x="224" y="186" width="64" height="220"/>
    <rect x="224" y="164" width="18" height="24"/>
    <rect x="247" y="164" width="18" height="24"/>
    <rect x="270" y="164" width="18" height="24"/>
    <!-- 左の塔 -->
    <rect x="126" y="256" width="58" height="150"/>
    <rect x="126" y="236" width="16" height="22"/>
    <rect x="147" y="236" width="16" height="22"/>
    <rect x="168" y="236" width="16" height="22"/>
    <!-- 右の塔 -->
    <rect x="328" y="256" width="58" height="150"/>
    <rect x="328" y="236" width="16" height="22"/>
    <rect x="349" y="236" width="16" height="22"/>
    <rect x="370" y="236" width="16" height="22"/>
    <!-- 胴 -->
    <rect x="144" y="322" width="224" height="84"/>
    <!-- 土台 -->
    <rect x="110" y="408" width="292" height="18" rx="5"/>
  </g>

  <!-- くりぬき（門・窓・すきま） -->
  <g fill="#0b0d12">
    <rect x="184" y="322" width="5" height="84"/>
    <rect x="323" y="322" width="5" height="84"/>
    <path d="M232 406 L232 372 A24 24 0 0 1 280 372 L280 406 Z"/>
    <rect x="247" y="226" width="18" height="28" rx="9"/>
    <rect x="146" y="292" width="18" height="26" rx="9"/>
    <rect x="348" y="292" width="18" height="26" rx="9"/>
  </g>

  <!-- 門の灯り -->
  <rect x="248" y="378" width="16" height="28" rx="8" fill="#f6e3ae" opacity=".92"/>
</svg>
