<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141b">
<title>beautiful state HOME</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOME">
<style>
  :root{
    --ground:#12141b;
    --ground2:#191c25;
    --line:rgba(214,196,150,.22);
    --line-soft:rgba(214,196,150,.12);
    --ink:#f2ece0;
    --ink-dim:rgba(242,236,224,.78);
    --gold:#d8b45f;
    --gold-soft:rgba(216,180,95,.16);
    --gold-glow:rgba(216,180,95,.38);
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(216,180,95,.10), transparent 60%),
      var(--ground);
    color:var(--ink);
    font-family:var(--mincho);
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top, 0px) 0 64px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 20px;}

  /* ------- あたま ------- */
  header{padding:34px 0 18px;text-align:center;}
  .logo{
    font-size:19px;letter-spacing:.22em;color:var(--gold);
    font-weight:400;margin:0;
  }
  .logo-sub{
    margin:10px 0 0;font-size:12.5px;color:var(--ink-dim);letter-spacing:.08em;
  }
  .rule{
    height:1px;margin:20px 0 0;
    background:linear-gradient(90deg,transparent,var(--line),transparent);
  }

  /* ------- 今日のこと（開いたら目に入る） ------- */
  .todaybar{
    margin-top:22px;background:var(--gold-soft);
    border:1px solid var(--gold-glow);border-radius:14px;
    padding:14px 16px 15px;width:100%;text-align:left;
    font-family:var(--mincho);color:var(--ink);
  }
  .todaybar .tt{font-size:12.5px;color:var(--gold);letter-spacing:.16em;}
  .todaybar .tl{font-size:15.5px;line-height:1.75;margin-top:8px;}
  .todaybar .tmm{
    font-size:12.5px;color:var(--gold);letter-spacing:.06em;
    border:1px solid var(--line);border-radius:999px;
    padding:1px 8px;margin-right:8px;white-space:nowrap;
  }

  /* ------- 選んでいる日 ------- */
  .day{padding:26px 0 6px;}
  .day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .day-date{font-size:27px;letter-spacing:.04em;}
  .day-tag{
    font-size:11.5px;color:var(--gold);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px;letter-spacing:.1em;
  }
  .back-today{
    margin-left:auto;font-size:12px;color:var(--ink-dim);
    background:none;border:none;font-family:var(--mincho);
    text-decoration:underline;text-underline-offset:4px;padding:4px 0;
  }

  .field{margin-top:20px;}
  .label{
    font-size:13px;color:var(--gold);letter-spacing:.12em;margin-bottom:8px;
    display:flex;align-items:center;gap:8px;
  }
  .label small{color:var(--ink-dim);font-size:12.5px;letter-spacing:.04em;}
  textarea{
    width:100%;min-height:74px;resize:none;overflow:hidden;
    background:var(--ground2);color:var(--ink);
    border:1px solid var(--line-soft);border-radius:12px;
    padding:14px 15px;font-size:16.5px;line-height:1.8;
    font-family:var(--mincho);
  }
  textarea:focus{outline:none;border-color:var(--gold-glow);}
  textarea::placeholder{color:rgba(242,236,224,.5);}

  /* 叶った */
  .grantbtn{
    margin-top:11px;background:none;border:1px solid var(--line);
    color:var(--gold);border-radius:999px;padding:8px 20px;
    font-family:var(--mincho);font-size:14.5px;letter-spacing:.1em;
  }
  .granted{
    margin-top:11px;display:flex;align-items:center;flex-wrap:wrap;gap:9px;
    background:var(--gold-soft);border:1px solid var(--gold-glow);
    border-radius:12px;padding:12px 14px;
  }
  .granted .gt{font-size:14.5px;color:var(--gold);letter-spacing:.06em;}
  .granted input{
    background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--ink);font-family:var(--mincho);font-size:13px;padding:4px 10px;
  }
  .granted button{
    margin-left:auto;background:none;border:none;color:var(--ink-dim);
    font-family:var(--mincho);font-size:12.5px;
    text-decoration:underline;text-underline-offset:4px;padding:4px 0;
  }

  /* 城のしるし */
  .castle{
    margin-top:18px;width:100%;display:flex;align-items:center;gap:13px;
    background:var(--ground2);border:1px solid var(--line-soft);
    border-radius:12px;padding:15px 16px;
    color:var(--ink);font-family:var(--mincho);font-size:16px;
    text-align:left;
  }
  .castle .mark{
    width:26px;height:26px;flex:none;border-radius:50%;
    border:1px solid var(--line);display:grid;place-items:center;
    font-size:13px;color:transparent;transition:.18s;
  }
  .castle.on{border-color:var(--gold-glow);background:var(--gold-soft);}
  .castle.on .mark{background:var(--gold);border-color:var(--gold);color:#191c25;}
  .castle .sub{margin-left:auto;font-size:12px;color:var(--ink-dim);}

  .saved{
    height:18px;margin-top:12px;font-size:12px;color:var(--gold);
    opacity:0;transition:opacity .35s;letter-spacing:.08em;text-align:right;
  }
  .saved.show{opacity:1;}

  /* ------- 自分のためにすること ------- */
  .todos{margin-top:4px;}
  .todo{
    display:flex;align-items:flex-start;gap:11px;padding:12px 2px;
    border-bottom:1px solid var(--line-soft);
  }
  .chk{
    width:25px;height:25px;flex:none;margin-top:2px;border-radius:50%;
    border:1px solid var(--line);background:none;
    display:grid;place-items:center;font-size:12px;color:transparent;
    transition:.18s;padding:0;
  }
  .todo.done .chk{background:var(--gold);border-color:var(--gold);color:#191c25;}
  .todo .body{flex:1;min-width:0;}
  .todo .tx{font-size:15.5px;line-height:1.7;word-break:break-word;}
  .todo.done .tx{color:var(--ink-dim);}
  .todo .tm{
    font-size:12px;color:var(--gold);letter-spacing:.06em;
    border:1px solid var(--line);border-radius:999px;padding:1px 8px;
    margin-right:8px;white-space:nowrap;
  }
  .ops{display:flex;gap:6px;margin-top:8px;}
  .op{
    font-size:12.5px;color:var(--ink-dim);background:none;
    border:1px solid var(--line-soft);border-radius:999px;
    padding:4px 11px;font-family:var(--mincho);
  }
  .op.date{padding:0;border:none;}
  .op.date input{
    background:none;border:1px solid var(--line-soft);border-radius:999px;
    color:var(--ink-dim);font-family:var(--mincho);font-size:12.5px;
    padding:4px 9px;
  }
  .addrow{display:flex;gap:8px;margin-top:14px;align-items:stretch;}
  .addrow input[type="text"]{
    flex:1;min-width:0;background:var(--ground2);color:var(--ink);
    border:1px solid var(--line-soft);border-radius:11px;
    padding:12px 13px;font-size:16px;font-family:var(--mincho);
  }
  .timebox{
    flex:1;min-width:0;display:flex;align-items:center;gap:10px;
    background:var(--ground2);border:1px solid var(--line-soft);
    border-radius:11px;padding:11px 13px;
  }
  .timebox .tlab{font-size:13.5px;color:var(--gold);letter-spacing:.1em;flex:none;}
  .timebox input{
    flex:1;min-width:0;background:none;border:none;padding:0;
    color:var(--ink);font-family:var(--mincho);font-size:16px;
  }
  .hint2{margin-top:9px;font-size:12.5px;color:rgba(242,236,224,.62);}
  .addrow input:focus{outline:none;border-color:var(--gold-glow);}
  .addrow input::placeholder{color:rgba(242,236,224,.5);}
  .addbtn{
    flex:none;background:var(--gold-soft);border:1px solid var(--line);
    color:var(--gold);border-radius:11px;padding:0 17px;
    font-family:var(--mincho);font-size:15px;letter-spacing:.06em;
  }
  .none{font-size:13.5px;color:rgba(242,236,224,.6);padding:12px 2px;}
  .split{height:1px;margin:18px 0 0;background:var(--line-soft);}
  #newver{
    position:sticky;top:0;z-index:9;text-align:center;
    background:var(--gold);color:#191c25;font-family:var(--mincho);
    font-size:14px;letter-spacing:.06em;padding:12px 16px;line-height:1.6;
  }
  .poolmsg{
    margin-top:10px;font-size:13px;color:var(--gold);line-height:1.6;
    background:var(--gold-soft);border:1px solid var(--gold-glow);
    border-radius:10px;padding:9px 12px;
  }
  .op.go{color:var(--gold);border-color:var(--line);}
  .hint{
    flex:1;align-self:center;font-size:12.5px;color:rgba(242,236,224,.62);
    letter-spacing:.03em;line-height:1.5;
  }

  /* ------- ためておく ------- */
  .pool{
    margin-top:32px;border:1px solid var(--line-soft);border-radius:14px;
    padding:18px 16px 20px;background:rgba(25,28,37,.5);
  }

  /* ------- カレンダー ------- */
  section{margin-top:34px;}
  .sec-title{
    font-size:13px;letter-spacing:.16em;color:var(--gold);
    text-align:center;margin:0 0 16px;
  }
  .cal-head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px;}
  .cal-head button{
    background:none;border:none;color:var(--ink-dim);font-size:20px;
    padding:6px 14px;font-family:var(--mincho);
  }
  .cal-month{font-size:17px;letter-spacing:.08em;min-width:132px;text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .wd{
    text-align:center;font-size:12px;color:var(--ink-dim);
    padding-bottom:6px;letter-spacing:.06em;
  }
  .wd.sun{color:rgba(226,150,150,.6);}
  .wd.sat{color:rgba(150,180,226,.6);}
  .cell{
    position:relative;height:50px;border-radius:10px;
    background:transparent;border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink);font-family:var(--mincho);font-size:15px;padding:0;
  }
  .cell.blank{visibility:hidden;}
  .cell.today{border-color:var(--line);}
  .cell.sel{border-color:var(--gold);}
  .cell.cst{
    background:radial-gradient(75% 75% at 50% 45%, rgba(216,180,95,.34), rgba(216,180,95,.05));
    border-color:rgba(216,180,95,.42);
    box-shadow:0 0 14px rgba(216,180,95,.20);
  }
  .cell.cst .n{color:#f6ead0;}
  .cell .n{position:relative;z-index:1;}
  .dot{
    position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:rgba(242,236,224,.85);
  }
  .star{
    position:absolute;top:4px;right:5px;font-size:10px;color:var(--gold);
    text-shadow:0 0 6px var(--gold-glow);
  }
  .legend{
    margin-top:16px;display:flex;flex-direction:column;gap:8px;
    font-size:12.5px;color:var(--ink-dim);
  }
  .legend div{display:flex;align-items:center;gap:9px;}
  .lg-castle{
    width:17px;height:17px;border-radius:5px;flex:none;
    background:radial-gradient(70% 70% at 50% 45%, rgba(216,180,95,.42), rgba(216,180,95,.1));
  }
  .lg-dot{width:17px;flex:none;text-align:center;color:rgba(242,236,224,.85);}
  .lg-star{width:17px;flex:none;text-align:center;color:var(--gold);}

  /* ------- 見返す ------- */
  .counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .count{
    background:var(--ground2);border:1px solid var(--line-soft);
    border-radius:12px;padding:14px 8px;text-align:center;
  }
  .count b{display:block;font-size:25px;color:var(--gold);font-weight:400;line-height:1.3;}
  .count span{font-size:12px;color:var(--ink-dim);letter-spacing:.04em;}
  .scope{
    display:flex;justify-content:center;gap:0;margin-bottom:14px;
    border:1px solid var(--line-soft);border-radius:999px;overflow:hidden;
  }
  .scope button{
    flex:1;background:none;border:none;padding:9px 0;font-size:13px;
    color:var(--ink-dim);font-family:var(--mincho);letter-spacing:.08em;
  }
  .scope button.on{background:var(--gold-soft);color:var(--gold);}
  .list{display:flex;flex-direction:column;gap:2px;}
  .item{
    width:100%;text-align:left;background:none;border:none;
    border-bottom:1px solid var(--line-soft);
    padding:14px 2px;font-family:var(--mincho);color:var(--ink);
  }
  .item .d{font-size:11.5px;color:var(--gold);letter-spacing:.08em;}
  .item .t{font-size:15px;margin-top:5px;line-height:1.75;white-space:pre-wrap;}
  .item .g{
    font-size:14px;margin-top:7px;color:var(--gold);line-height:1.75;
    white-space:pre-wrap;padding-left:14px;border-left:1px solid var(--line);
  }
  .item .dn{font-size:13.5px;margin-top:6px;color:var(--ink-dim);line-height:1.7;}
  .empty{font-size:13px;color:var(--ink-dim);text-align:center;padding:26px 0;}

  footer{
    margin-top:44px;text-align:center;font-size:11.5px;color:rgba(242,236,224,.45);
    letter-spacing:.06em;line-height:2;
  }
</style>
</head>
<body>
<div id="newver" style="display:none"></div>
<div class="wrap">

  <header>
    <h1 class="logo">beautiful state HOME</h1>
    <p class="logo-sub">意図したことは、叶う</p>
    <div class="rule"></div>
  </header>

  <div class="todaybar" id="todaybar" style="display:none"></div>

  <!-- 選んでいる日 -->
  <div class="day">
    <div class="day-head">
      <div class="day-date" id="dDate">—</div>
      <div class="day-tag" id="dTag" hidden>今日</div>
      <button class="back-today" id="btnToday" hidden>今日にもどる</button>
    </div>

    <div class="field">
      <div class="label">今日の意図 <small>ひとつだけ</small></div>
      <textarea id="tIntent" placeholder="ここに、意図をひとつ書く"></textarea>
      <div id="grant"></div>
    </div>

    <button class="castle" id="btnCastle">
      <span class="mark">✓</span>
      <span id="castleLabel">城に還った</span>
      <span class="sub" id="castleSub"></span>
    </button>

    <div class="field">
      <div class="label">自分のためにすること</div>
      <div class="addrow" style="margin-top:6px">
        <input type="text" id="aText" placeholder="城のカーテンを見に行く">
      </div>
      <div class="addrow">
        <label class="timebox"><span class="tlab">時間</span><input type="time" id="aTime"></label>
        <button class="addbtn" id="aBtn">入れる</button>
      </div>
      <div class="hint2">時間は、決まっているときだけで大丈夫です</div>
      <div class="split"></div>
      <div class="todos" id="todos"></div>
    </div>

    <div class="saved" id="saved">書きとめました</div>
  </div>

  <!-- ためておく -->
  <div class="pool">
    <div class="label">ためておく <small>日はまだ決めていない分</small></div>
    <div class="addrow" style="margin-top:6px">
      <input type="text" id="pText" placeholder="城に買うもの、行きたいところ">
      <button class="addbtn" id="pBtn">入れる</button>
    </div>
    <div class="hint2">日を選んで、この日に入れる を押してください</div>
    <div class="poolmsg" id="poolMsg" style="display:none"></div>
    <div class="split"></div>
    <div class="todos" id="pool"></div>
  </div>

  <!-- カレンダー -->
  <section>
    <h2 class="sec-title">カレンダー</h2>
    <div class="cal-head">
      <button id="prevM" aria-label="前の月">‹</button>
      <div class="cal-month" id="calMonth">—</div>
      <button id="nextM" aria-label="次の月">›</button>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="legend">
      <div><span class="lg-castle"></span>金色にひかる日 ＝ 城</div>
      <div><span class="lg-dot">•</span>下の点 ＝ 意図を置いた日</div>
      <div><span class="lg-star">✦</span>右上の印 ＝ 叶った日</div>
    </div>
  </section>

  <!-- 見返す -->
  <section>
    <h2 class="sec-title">見返す</h2>
    <div class="scope">
      <button id="scMonth" class="on">この月</button>
      <button id="scAll">はじめから</button>
    </div>
    <div class="counts">
      <div class="count"><b id="cIntent">0</b><span>意図を置いた日</span></div>
      <div class="count"><b id="cCastle">0</b><span>城</span></div>
      <div class="count"><b id="cGranted">0</b><span>叶った</span></div>
      <div class="count"><b id="cDone">0</b><span>自分のためにできたこと</span></div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <footer>
    書いたものは、この端末の中だけに残ります<br>
    beautiful state HOME　<span id="ver"></span>
  </footer>

</div>

<script>
(function(){
  "use strict";

  var VER = "v7";
  var KEY = "beautiful-state-home-v1";
  var WD = ["日","月","火","水","木","金","土"];

  var store = load();
  var today = ymd(new Date());
  var sel = today;
  var view = sel.slice(0,7);
  var scope = "month";

  /* ---------- 保存まわり ---------- */
  function load(){
    var raw = null;
    try{ raw = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    if(!raw || typeof raw !== "object") return {days:{}, pool:[]};
    var st = raw.days ? raw : {days: raw, pool: []};   // まえの形からの引きつぎ
    if(!st.pool) st.pool = [];
    // 「叶ったこと（書く欄）」から「叶った日」への引きつぎ
    Object.keys(st.days).forEach(function(k){
      var r = st.days[k];
      if(typeof r.granted === "string"){
        if(r.granted.trim()){
          if(!r.grantedOn) r.grantedOn = k;
          r.grantedText = r.granted;
        }
        delete r.granted;
      }
    });
    return st;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
    flash();
  }
  var flashT;
  function flash(){
    var el = document.getElementById("saved");
    el.classList.add("show");
    clearTimeout(flashT);
    flashT = setTimeout(function(){ el.classList.remove("show"); }, 1400);
  }
  function rec(d){
    if(!store.days[d]) store.days[d] = {intent:"", castle:false, grantedOn:"", todos:[]};
    if(!store.days[d].todos) store.days[d].todos = [];
    return store.days[d];
  }
  function get(d){
    var r = store.days[d];
    return r ? r : {intent:"", castle:false, grantedOn:"", todos:[]};
  }
  function todosOf(d){
    var r = store.days[d];
    return (r && r.todos) ? r.todos : [];
  }
  function has(d){
    var r = store.days[d];
    if(!r) return false;
    return !!(r.intent && r.intent.trim()) || r.castle
        || !!r.grantedOn
        || !!(r.todos && r.todos.length);
  }
  function tidy(d){
    if(store.days[d] && !has(d)) delete store.days[d];
  }
  function uid(){
    return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  /* ---------- 日付 ---------- */
  function ymd(dt){
    var m = dt.getMonth()+1, d = dt.getDate();
    return dt.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (d<10?"0":"") + d;
  }
  function parse(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function jp(s){
    var dt = parse(s);
    return (dt.getMonth()+1) + "月" + dt.getDate() + "日（" + WD[dt.getDay()] + "）";
  }
  function plus(s, n){
    var dt = parse(s);
    dt.setDate(dt.getDate() + n);
    return ymd(dt);
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  /* ---------- 選んでいる日 ---------- */
  var tIntent  = document.getElementById("tIntent");
  var btnCastle= document.getElementById("btnCastle");
  var grantBox = document.getElementById("grant");

  function drawDay(){
    var r = get(sel);
    document.getElementById("dDate").textContent = jp(sel);
    document.getElementById("dTag").hidden = (sel !== today);
    document.getElementById("btnToday").hidden = (sel === today);

    tIntent.value = r.intent || "";
    grow(tIntent);
    drawGrant();

    var future = sel > today;
    document.getElementById("castleLabel").textContent = future ? "城に還る" : "城に還った";
    document.getElementById("castleSub").textContent   = future ? "先に置いておく" : "";
    btnCastle.classList.toggle("on", !!r.castle);

    drawTodos();
  }

  function grow(el){
    el.style.height = "auto";
    el.style.height = (el.scrollHeight + 2) + "px";
  }

  var typeT;
  function onType(el, field){
    grow(el);
    var d = sel;                 // 打っている間に日を変えても、元の日に入るように
    clearTimeout(typeT);
    typeT = setTimeout(function(){
      rec(d)[field] = el.value;
      tidy(d);
      save();
      if(d === sel) drawGrant();
      drawCal(); drawBack();
    }, 400);
  }
  tIntent.addEventListener("input", function(){ onType(tIntent, "intent"); });
  tIntent.addEventListener("blur", function(){ rec(sel).intent = tIntent.value; tidy(sel); save(); drawGrant(); drawCal(); drawBack(); });

  /* ---------- 叶った ---------- */
  function drawGrant(){
    var r = get(sel);
    if(!(r.intent && r.intent.trim()) && !r.grantedOn){
      grantBox.innerHTML = "";
      return;
    }
    if(r.grantedOn){
      grantBox.innerHTML =
        '<div class="granted">'
      +   '<span class="gt">✦ 叶った日</span>'
      +   '<input type="date" id="gDate" value="'+r.grantedOn+'">'
      +   '<button id="gUndo">もどす</button>'
      + '</div>';
    } else {
      grantBox.innerHTML = '<button class="grantbtn" id="gBtn">✦ 叶った</button>';
    }
  }

  grantBox.addEventListener("click", function(e){
    if(e.target.id === "gBtn"){
      rec(sel).grantedOn = today;
      save();
      drawGrant(); drawCal(); drawBack();
    } else if(e.target.id === "gUndo"){
      rec(sel).grantedOn = "";
      tidy(sel);
      save();
      drawGrant(); drawCal(); drawBack();
    }
  });

  grantBox.addEventListener("change", function(e){
    if(e.target.id !== "gDate" || !e.target.value) return;
    rec(sel).grantedOn = e.target.value;
    save();
    drawGrant(); drawCal(); drawBack();
  });

  btnCastle.addEventListener("click", function(){
    var r = rec(sel);
    r.castle = !r.castle;
    tidy(sel);
    save();
    drawDay(); drawCal(); drawBack();
  });

  document.getElementById("btnToday").addEventListener("click", function(){
    sel = today; view = sel.slice(0,7);
    drawDay(); drawCal(); drawBack();
    window.scrollTo({top:0, behavior:"smooth"});
  });

  /* ---------- 自分のためにすること ---------- */
  function sortTodos(a){
    return a.slice().sort(function(x, y){
      if(!!x.time !== !!y.time) return x.time ? -1 : 1;
      if(x.time && y.time && x.time !== y.time) return x.time < y.time ? -1 : 1;
      return 0;
    });
  }

  function drawTodos(){
    var box = document.getElementById("todos");
    var list = sortTodos(todosOf(sel));
    if(!list.length){
      box.innerHTML = '<div class="none">入れたものが、ここに並びます</div>';
      return;
    }
    var html = "";
    list.forEach(function(t){
      html += '<div class="todo'+(t.done?' done':'')+'" data-id="'+t.id+'">'
            +   '<button class="chk" data-act="done">✓</button>'
            +   '<div class="body">'
            +     '<div class="tx">'
            +       (t.time ? '<span class="tm">'+esc(t.time)+'</span>' : '')
            +       esc(t.text)
            +     '</div>'
            +     '<div class="ops">'
            +       '<button class="op" data-act="tomorrow">あすへ</button>'
            +       '<button class="op" data-act="pool">ためておくへ</button>'
            +       '<button class="op" data-act="del">消す</button>'
            +     '</div>'
            +   '</div>'
            + '</div>';
    });
    box.innerHTML = html;
  }

  document.getElementById("todos").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b) return;
    var row = e.target.closest(".todo");
    var id = row.dataset.id;
    var arr = rec(sel).todos;
    var i = arr.findIndex(function(t){ return t.id === id; });
    if(i < 0) return;
    var act = b.dataset.act;

    if(act === "done"){
      arr[i].done = !arr[i].done;
    } else if(act === "tomorrow"){
      var t = arr.splice(i,1)[0];
      t.done = false;
      rec(plus(sel,1)).todos.push(t);
    } else if(act === "pool"){
      var p = arr.splice(i,1)[0];
      store.pool.push({id:p.id, text:p.text});
    } else if(act === "del"){
      if(!confirm("消しますか？")) return;
      arr.splice(i,1);
    }
    tidy(sel);
    save();
    drawTodos(); drawPool(); drawCal(); drawBack();
  });

  var aText = document.getElementById("aText");
  var aTime = document.getElementById("aTime");
  function addTodo(){
    var v = aText.value.trim();
    if(!v) return;
    rec(sel).todos.push({id:uid(), text:v, time:aTime.value || "", done:false});
    aText.value = ""; aTime.value = "";
    save();
    drawTodos(); drawCal(); drawBack();
  }
  document.getElementById("aBtn").addEventListener("click", addTodo);
  aText.addEventListener("keydown", function(e){ if(e.key === "Enter") addTodo(); });

  /* ---------- ためておく ---------- */
  function drawPool(){
    var box = document.getElementById("pool");
    if(!store.pool.length){
      box.innerHTML = '<div class="none">入れたものが、ここにたまります</div>';
      return;
    }
    var html = "";
    store.pool.forEach(function(t){
      html += '<div class="todo" data-id="'+t.id+'">'
            +   '<div class="body">'
            +     '<div class="tx">'+esc(t.text)+'</div>'
            +     '<div class="ops">'
            +       '<span class="op date"><input type="date" data-act="pick" aria-label="日を決める"></span>'
            +       '<button class="op go" data-act="toDay">この日に入れる</button>'
            +       '<button class="op" data-act="del">消す</button>'
            +     '</div>'
            +   '</div>'
            + '</div>';
    });
    box.innerHTML = html;
  }

  function poolIndex(el){
    var row = el.closest(".todo");
    if(!row) return -1;
    return store.pool.findIndex(function(t){ return t.id === row.dataset.id; });
  }

  var poolMsgT;
  function poolMsg(txt){
    var el = document.getElementById("poolMsg");
    el.textContent = txt;
    el.style.display = txt ? "block" : "none";
    clearTimeout(poolMsgT);
    if(txt) poolMsgT = setTimeout(function(){ poolMsg(""); }, 5000);
  }

  document.getElementById("pool").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b) return;
    var i = poolIndex(b);
    if(i < 0) return;

    if(b.dataset.act === "del"){
      if(!confirm("消しますか？")) return;
      store.pool.splice(i,1);
      save();
      drawPool();
      return;
    }

    // 日を選んでから、自分で押して決める
    if(b.dataset.act === "toDay"){
      var row = b.closest(".todo");
      var inp = row.querySelector('input[data-act="pick"]');
      var d = inp ? inp.value : "";
      if(!d){
        poolMsg("さきに、日を選んでください");
        return;
      }
      var t = store.pool.splice(i,1)[0];
      rec(d).todos.push({id:t.id, text:t.text, time:"", done:false});
      save();
      drawPool(); drawTodos(); drawCal(); drawBack();
      poolMsg(t.text + " を " + jp(d) + " に入れました");
    }
  });

  var pText = document.getElementById("pText");
  function addPool(){
    var v = pText.value.trim();
    if(!v) return;
    store.pool.push({id:uid(), text:v});
    pText.value = "";
    save();
    drawPool();
  }
  document.getElementById("pBtn").addEventListener("click", addPool);
  pText.addEventListener("keydown", function(e){ if(e.key === "Enter") addPool(); });

  /* ---------- 今日のこと ---------- */
  function drawToday(){
    var bar = document.getElementById("todaybar");
    var r = get(today);
    var lines = [];

    if(r.castle) lines.push('<div class="tl">城に還る日</div>');

    sortTodos(todosOf(today)).forEach(function(t){
      if(t.done) return;
      lines.push('<div class="tl">'
        + (t.time ? '<span class="tmm">'+esc(t.time)+'</span>' : '')
        + esc(t.text) + '</div>');
    });

    if(!lines.length){ bar.style.display = "none"; bar.innerHTML = ""; return; }
    bar.innerHTML = '<div class="tt">今日</div>' + lines.join("");
    bar.style.display = "block";
  }

  document.getElementById("todaybar").addEventListener("click", function(){
    sel = today; view = sel.slice(0,7);
    drawDay(); drawPool(); drawCal(); drawBack();
  });

  /* ---------- カレンダー ---------- */
  var calGrid = document.getElementById("calGrid");

  function grantedMap(){
    var m = {};
    Object.keys(store.days).forEach(function(k){
      var g = store.days[k].grantedOn;
      if(g) m[g] = true;
    });
    return m;
  }

  function drawCal(){
    var y = +view.slice(0,4), m = +view.slice(5,7);
    var gm = grantedMap();
    document.getElementById("calMonth").textContent = y + "年" + m + "月";

    var html = "";
    for(var w=0; w<7; w++){
      var cls = w===0 ? " sun" : (w===6 ? " sat" : "");
      html += '<div class="wd'+cls+'">'+WD[w]+'</div>';
    }

    var first = new Date(y, m-1, 1);
    var lead = first.getDay();
    var days = new Date(y, m, 0).getDate();

    for(var i=0; i<lead; i++) html += '<button class="cell blank"></button>';

    for(var d=1; d<=days; d++){
      var key = y + "-" + (m<10?"0":"") + m + "-" + (d<10?"0":"") + d;
      var r = store.days[key] || {};
      var c = "cell";
      if(r.castle) c += " cst";
      if(key === today) c += " today";
      if(key === sel)   c += " sel";
      var dotted = (r.intent && r.intent.trim()) || (r.todos && r.todos.length);
      html += '<button class="'+c+'" data-d="'+key+'">'
            +   '<span class="n">'+d+'</span>'
            +   (gm[key] ? '<span class="star">✦</span>' : '')
            +   (dotted ? '<span class="dot"></span>' : '')
            + '</button>';
    }
    calGrid.innerHTML = html;
    drawToday();
  }

  calGrid.addEventListener("click", function(e){
    var b = e.target.closest(".cell");
    if(!b || !b.dataset.d) return;
    sel = b.dataset.d;
    drawDay(); drawCal(); drawPool();
    window.scrollTo({top:0, behavior:"smooth"});
  });

  document.getElementById("prevM").addEventListener("click", function(){ shift(-1); });
  document.getElementById("nextM").addEventListener("click", function(){ shift(1); });
  function shift(n){
    var y = +view.slice(0,4), m = +view.slice(5,7) + n;
    if(m < 1){ m = 12; y--; }
    if(m > 12){ m = 1; y++; }
    view = y + "-" + (m<10?"0":"") + m;
    drawCal(); drawBack();
  }

  /* ---------- 見返す ---------- */
  function keys(){
    var all = Object.keys(store.days).sort().reverse();
    if(scope === "all") return all;
    return all.filter(function(k){ return k.slice(0,7) === view; });
  }

  function drawBack(){
    var ks = keys();
    var ci=0, cc=0, cg=0, cd=0;
    ks.forEach(function(k){
      var r = store.days[k];
      if(r.intent && r.intent.trim()) ci++;
      if(r.castle) cc++;
      if(r.grantedOn) cg++;
      (r.todos||[]).forEach(function(t){ if(t.done) cd++; });
    });
    document.getElementById("cIntent").textContent  = ci;
    document.getElementById("cCastle").textContent  = cc;
    document.getElementById("cGranted").textContent = cg;
    document.getElementById("cDone").textContent    = cd;

    var list = document.getElementById("list");
    if(!ks.length){
      list.innerHTML = '<div class="empty">ここに、置いた意図が集まります</div>';
      return;
    }
    var html = "";
    ks.forEach(function(k){
      var r = store.days[k];
      var done = (r.todos||[]).filter(function(t){ return t.done; });
      html += '<button class="item" data-d="'+k+'">'
            +   '<div class="d">'+jp(k)+(r.castle ? "　城" : "")+'</div>'
            +   (r.intent && r.intent.trim() ? '<div class="t">'+esc(r.intent)+'</div>' : '')
            +   (r.grantedOn ? '<div class="g">✦ 叶った　'+jp(r.grantedOn)+(r.grantedText ? '<br>'+esc(r.grantedText) : '')+'</div>' : '')
            +   (done.length ? '<div class="dn">'+done.map(function(t){
                  return "✓ " + esc(t.text);
                }).join("<br>")+'</div>' : '')
            + '</button>';
    });
    list.innerHTML = html;
  }

  document.getElementById("list").addEventListener("click", function(e){
    var b = e.target.closest(".item");
    if(!b) return;
    sel = b.dataset.d;
    view = sel.slice(0,7);
    drawDay(); drawCal(); drawPool(); drawBack();
    window.scrollTo({top:0, behavior:"smooth"});
  });

  var scM = document.getElementById("scMonth"), scA = document.getElementById("scAll");
  scM.addEventListener("click", function(){ scope="month"; scM.classList.add("on"); scA.classList.remove("on"); drawBack(); });
  scA.addEventListener("click", function(){ scope="all";   scA.classList.add("on"); scM.classList.remove("on"); drawBack(); });

  /* ---------- 日をまたいだら、今日を切りかえる ---------- */
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) return;
    var now = ymd(new Date());
    if(now === today) return;
    var wasToday = (sel === today);
    today = now;
    if(wasToday){ sel = today; view = sel.slice(0,7); }
    drawDay(); drawPool(); drawCal(); drawBack();
  });

  /* ---------- 新しい版のお知らせ ---------- */
  document.getElementById("ver").textContent = VER;
  try{
    fetch(location.pathname + "?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var m = t.match(/var VER = "(v\d+)"/);
        if(!m || m[1] === VER) return;
        var bar = document.getElementById("newver");
        bar.textContent = "新しい版があります　ここを押すと入れかわります";
        bar.style.display = "block";
        bar.addEventListener("click", function(){ location.reload(); });
      })
      .catch(function(){});
  }catch(e){}

  /* ---------- はじめ ---------- */
  drawDay(); drawPool(); drawCal(); drawBack();
})();
</script>
</body>
</html>
